version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # action v2 needs Changesets CLI v3; we are on v2
      - dependency-name: changesets/action
        update-types: [version-update:semver-major]
